<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Darsham Ganthiya - Kitchen Screen</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#d9480f">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<div class="page" id="appRoot" style="display:none;">
  <div class="top-bar">
    <h1>Kitchen Screen</h1>
    <button class="icon-btn" id="logoutBtn">Log Out</button>
  </div>

  <div id="ticketsWrap">
    <div class="empty-state">Loading...</div>
  </div>
</div>

<div class="page" id="loadingRoot">
  <p style="color:var(--muted);">Loading...</p>
</div>

<footer class="site-footer">
  <div><a href="mailto:vkvcoder.support@gmail.com">vkvcoder.support@gmail.com</a></div>
  <div class="powered-by">Powered by AnyApps.in</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./js/config.js"></script>
<script>
registerServiceWorker();

let isOwnerSession = false;
let refreshTimer = null;
let knownItemIds = new Set();
let firstLoad = true;
const expandedRoundIds = new Set();

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function loadRoundContext(rounds) {
  const sessionIds = [...new Set(rounds.map((r) => r.session_id))];
  if (sessionIds.length === 0) return { sessionsById: {}, tablesById: {} };

  const { data: sessions } = await supabaseClient
    .from('ag_sessions')
    .select('id, table_id')
    .in('id', sessionIds);

  const tableIds = [...new Set((sessions || []).map((s) => s.table_id))];
  const { data: tables } = tableIds.length
    ? await supabaseClient.from('ag_tables').select('id, table_no').in('id', tableIds)
    : { data: [] };

  const sessionsById = {};
  (sessions || []).forEach((s) => { sessionsById[s.id] = s; });
  const tablesById = {};
  (tables || []).forEach((t) => { tablesById[t.id] = t; });

  return { sessionsById, tablesById };
}

async function loadTickets() {
  const wrap = document.getElementById('ticketsWrap');

  const { data: rounds, error } = await supabaseClient
    .from('ag_order_rounds')
    .select('id, session_id, round_no, created_at')
    .eq('status', 'confirmed')
    .order('created_at', { ascending: true });

  if (error) {
    wrap.innerHTML = '<div class="empty-state">Could not load: ' + escapeHtml(error.message) + '</div>';
    return;
  }

  const roundIds = (rounds || []).map((r) => r.id);
  let items = [];
  if (roundIds.length > 0) {
    const { data } = await supabaseClient
      .from('ag_order_items')
      .select('id, round_id, item_name, qty, prepared')
      .in('round_id', roundIds)
      .order('item_name', { ascending: true });
    items = data || [];
  }

  const itemsByRound = {};
  items.forEach((i) => {
    if (!itemsByRound[i.round_id]) itemsByRound[i.round_id] = [];
    itemsByRound[i.round_id].push(i);
  });

  // A round stays on Kitchen (showing ALL its items, not just pending ones) until
  // every item on it is prepared.
  const activeRounds = (rounds || []).filter((r) => (itemsByRound[r.id] || []).some((i) => !i.prepared));

  if (activeRounds.length === 0) {
    wrap.innerHTML = '<div class="empty-state">No pending items. All caught up!</div>';
    knownItemIds = new Set();
    firstLoad = false;
    return;
  }

  const { sessionsById, tablesById } = await loadRoundContext(activeRounds);

  // "New" means a genuinely new item just arrived (a fresh confirmed order), not a status change.
  const currentItemIds = new Set(items.map((i) => i.id));
  const newItemIds = firstLoad ? [] : [...currentItemIds].filter((id) => !knownItemIds.has(id));

  wrap.innerHTML = activeRounds.map((r) => {
    const session = sessionsById[r.session_id] || {};
    const table = tablesById[session.table_id] || {};
    const roundItems = itemsByRound[r.id] || [];
    const isNew = roundItems.some((i) => newItemIds.includes(i.id));
    const isOpen = expandedRoundIds.has(r.id);

    const pendingCount = roundItems.filter((i) => !i.prepared).length;
    const readyCount = roundItems.filter((i) => i.prepared).length;

    const summaryPills = [
      pendingCount > 0 ? `<span class="status-pill pending">${pendingCount} Pending</span>` : '',
      readyCount > 0 ? `<span class="status-pill ready">${readyCount} Ready</span>` : ''
    ].join('');

    return `
      <div class="table-row ${isNew ? 'is-new' : ''} ${isOpen ? 'is-open' : ''}" data-round="${r.id}">
        <button type="button" class="table-row-header" data-toggle="${r.id}">
          <span class="trh-left">
            <h4>Table ${table.table_no || '?'} &middot; Round ${r.round_no}</h4>
            <span class="trh-summary">${summaryPills}</span>
          </span>
          <span class="trh-chevron">&#9656;</span>
        </button>
        <div class="table-row-body">
          ${roundItems.map((i) => {
            const btn = i.prepared
              ? `<button type="button" class="item-status-btn state-served" disabled>Ready</button>`
              : `<button type="button" class="item-status-btn state-pending ready-btn" data-id="${i.id}">Pending</button>`;
            return `
              <div class="item-status-row">
                <span class="item-name">${escapeHtml(i.item_name)} <span class="item-qty">x${i.qty}</span></span>
                ${btn}
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;
  }).join('');

  wrap.querySelectorAll('[data-toggle]').forEach((btn) => {
    btn.addEventListener('click', () => toggleRound(btn.dataset.toggle));
  });
  wrap.querySelectorAll('.ready-btn').forEach((btn) => {
    btn.addEventListener('click', () => markReady(btn.dataset.id, btn));
  });

  if (newItemIds.length > 0) playAlertSound();
  knownItemIds = currentItemIds;
  firstLoad = false;
}

function toggleRound(roundId) {
  if (expandedRoundIds.has(roundId)) {
    expandedRoundIds.delete(roundId);
  } else {
    expandedRoundIds.add(roundId);
  }
  const card = document.querySelector('.table-row[data-round="' + roundId + '"]');
  if (card) card.classList.toggle('is-open');
}

async function markReady(itemId, btn) {
  btn.disabled = true;
  const { error } = await supabaseClient
    .from('ag_order_items')
    .update({ prepared: true })
    .eq('id', itemId);

  if (error) {
    btn.disabled = false;
    alert('Could not update: ' + error.message);
    return;
  }
  // Item moves to Waiter's queue; the row drops off Kitchen once every item on it is prepared.
  loadTickets();
}

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await supabaseClient.auth.signOut();
  window.location.href = isOwnerSession ? 'owner-dashboard.html' : 'staff-login.html';
});

(async () => {
  const access = await checkStaffOrOwnerAccess('kitchen');

  if (!access.ok) {
    await supabaseClient.auth.signOut();
    window.location.href = 'staff-login.html';
    return;
  }

  isOwnerSession = access.isOwner;

  document.getElementById('loadingRoot').style.display = 'none';
  document.getElementById('appRoot').style.display = 'flex';

  loadTickets();
  refreshTimer = setInterval(loadTickets, 6000);
})();

window.addEventListener('beforeunload', () => {
  if (refreshTimer) clearInterval(refreshTimer);
});
</script>
</body>
</html>
