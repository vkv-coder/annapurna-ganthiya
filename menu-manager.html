<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Darsham Ganthiya - Menu Manager</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#d9480f">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<div class="page" id="appRoot" style="display:none;">

  <div class="top-bar">
    <h1>Menu Manager</h1>
    <a href="owner-dashboard.html" class="icon-btn">&larr; Dashboard</a>
  </div>

  <div class="staff-list" id="menuList">
    <div class="empty-state">Loading menu...</div>
  </div>

  <div class="card" id="addItemCard">
    <h2>Add Menu Item</h2>
    <form id="addItemForm">
      <label for="itemName">Item Name</label>
      <input type="text" id="itemName" required placeholder="e.g. Ganthiya">

      <label for="itemPrice">Price (&#8377;)</label>
      <input type="text" id="itemPrice" required inputmode="decimal" placeholder="e.g. 150">

      <label for="itemUnit">Unit</label>
      <input type="text" id="itemUnit" required placeholder="e.g. per 100g, per pc, per plate">

      <button type="submit" class="btn-primary" id="addItemBtn">Add Item</button>
    </form>
    <div class="msg" id="addItemMsg"></div>
  </div>

</div>

<div class="page" id="loadingRoot">
  <p style="color:var(--muted);">Loading...</p>
</div>

<footer class="site-footer">
  <div><a href="privacy.html">Privacy Policy</a> &middot; <a href="mailto:vkvcoder.support@gmail.com">vkvcoder.support@gmail.com</a></div>
  <div class="powered-by">Powered by AnyApps.in</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./js/config.js"></script>
<script>
registerServiceWorker();

const DEFAULT_CATEGORY = 'General';

function showMsg(el, text, type) {
  el.textContent = text;
  el.className = 'msg show msg-' + type;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function formatPrice(price) {
  const n = Number(price);
  return '₹' + (Number.isInteger(n) ? n : n.toFixed(2));
}

async function loadMenu() {
  const listEl = document.getElementById('menuList');
  const { data, error } = await supabaseClient
    .from('ag_menu_items')
    .select('id, name, price, unit, is_paused, created_at')
    .eq('is_deleted', false)
    .order('created_at', { ascending: false });

  if (error) {
    listEl.innerHTML = '<div class="empty-state">Could not load menu: ' + escapeHtml(error.message) + '</div>';
    return;
  }

  if (!data || data.length === 0) {
    listEl.innerHTML = '<div class="empty-state">No menu items yet.</div>';
    return;
  }

  listEl.innerHTML = data.map((row) => `
    <div class="staff-row" data-id="${row.id}">
      <div class="info">
        <h4>${escapeHtml(row.name)}</h4>
        <p>${formatPrice(row.price)} <span style="color:var(--muted);">${escapeHtml(row.unit)}</span></p>
      </div>
      <div style="display:flex; align-items:center; gap:14px;">
        <label class="toggle-switch">
          <input type="checkbox" class="available-toggle" ${row.is_paused ? '' : 'checked'} data-id="${row.id}">
          <span class="toggle-slider"></span>
        </label>
        <button type="button" class="icon-btn remove-item-btn" data-id="${row.id}" data-name="${escapeHtml(row.name)}">Remove</button>
      </div>
    </div>
  `).join('');

  document.querySelectorAll('.available-toggle').forEach((toggle) => {
    toggle.addEventListener('change', onToggleAvailable);
  });
  document.querySelectorAll('.remove-item-btn').forEach((btn) => {
    btn.addEventListener('click', onRemoveItem);
  });
}

async function onToggleAvailable(e) {
  const checkbox = e.target;
  const id = checkbox.dataset.id;
  const isAvailable = checkbox.checked;

  checkbox.disabled = true;
  const { error } = await supabaseClient
    .from('ag_menu_items')
    .update({ is_paused: !isAvailable })
    .eq('id', id);
  checkbox.disabled = false;

  if (error) {
    checkbox.checked = !isAvailable;
    alert('Could not update item: ' + error.message);
  }
}

async function onRemoveItem(e) {
  const btn = e.target;
  const id = btn.dataset.id;
  const name = btn.dataset.name;

  if (!confirm('Remove "' + name + '" from the menu?')) return;

  btn.disabled = true;
  const { error } = await supabaseClient
    .from('ag_menu_items')
    .update({ is_deleted: true })
    .eq('id', id);

  if (error) {
    btn.disabled = false;
    alert('Could not remove item: ' + error.message);
    return;
  }
  loadMenu();
}

document.getElementById('addItemForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const name = document.getElementById('itemName').value.trim();
  const priceRaw = document.getElementById('itemPrice').value.trim();
  const unit = document.getElementById('itemUnit').value.trim();
  const msgEl = document.getElementById('addItemMsg');
  const btn = document.getElementById('addItemBtn');

  const price = Number(priceRaw);
  if (!name) {
    showMsg(msgEl, 'Please enter an item name.', 'error');
    return;
  }
  if (!priceRaw || isNaN(price) || price <= 0) {
    showMsg(msgEl, 'Please enter a valid price.', 'error');
    return;
  }
  if (!unit) {
    showMsg(msgEl, 'Please enter a unit (e.g. per pc, per 100g).', 'error');
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Adding...';

  const { error } = await supabaseClient
    .from('ag_menu_items')
    .insert({
      name: name,
      price: price,
      unit: unit,
      category: DEFAULT_CATEGORY,
      is_paused: false,
      is_deleted: false
    });

  btn.disabled = false;
  btn.textContent = 'Add Item';

  if (error) {
    showMsg(msgEl, error.message, 'error');
    return;
  }

  showMsg(msgEl, 'Item added.', 'success');
  document.getElementById('addItemForm').reset();
  loadMenu();
});

(async () => {
  const { data: sessionData } = await supabaseClient.auth.getSession();
  const user = sessionData.session ? sessionData.session.user : null;

  if (!user) {
    window.location.href = 'index.html';
    return;
  }

  const { data: profile, error } = await supabaseClient
    .from('ag_restaurant_profile')
    .select('approval_status')
    .eq('owner_user_id', user.id)
    .maybeSingle();

  if (error || !profile || profile.approval_status !== 'approved') {
    window.location.href = 'index.html';
    return;
  }

  document.getElementById('loadingRoot').style.display = 'none';
  document.getElementById('appRoot').style.display = 'flex';

  loadMenu();
})();
</script>
</body>
</html>
