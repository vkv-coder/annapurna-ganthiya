<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Darsham Ganthiya - Menu Manager</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#d9480f">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<div class="page" id="appRoot" style="display:none;">

  <div class="top-bar">
    <h1>Menu Manager</h1>
    <a href="owner-dashboard.html" class="icon-btn">&larr; Dashboard</a>
  </div>

  <div class="staff-list" id="menuList">
    <div class="empty-state">Loading menu...</div>
  </div>

  <div class="card" id="addItemCard">
    <h2>Add Menu Item</h2>
    <form id="addItemForm">
      <label for="itemName">Item Name</label>
      <input type="text" id="itemName" required placeholder="e.g. Ganthiya">

      <label for="itemPrice">Price (&#8377;)</label>
      <input type="text" id="itemPrice" required inputmode="decimal" placeholder="e.g. 150">

      <label for="itemUnit">Unit</label>
      <input type="text" id="itemUnit" required placeholder="e.g. per 100g, per pc, per plate">

      <label for="itemGstRate">GST Rate (%)</label>
      <input type="text" id="itemGstRate" required inputmode="decimal" value="5" placeholder="e.g. 5">

      <button type="submit" class="btn-primary" id="addItemBtn">Add Item</button>
    </form>
    <div class="msg" id="addItemMsg"></div>
  </div>

</div>

<div class="page" id="loadingRoot">
  <p style="color:var(--muted);">Loading...</p>
</div>

<footer class="site-footer">
  <div><a href="privacy.html">Privacy Policy</a> &middot; <a href="mailto:vkvcoder.support@gmail.com">vkvcoder.support@gmail.com</a></div>
  <div class="powered-by">Powered by AnyApps.in</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./js/config.js"></script>
<script>
registerServiceWorker();

const DEFAULT_CATEGORY = 'General';

function showMsg(el, text, type) {
  el.textContent = text;
  el.className = 'msg show msg-' + type;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function formatPrice(price) {
  const n = Number(price);
  return '₹' + (Number.isInteger(n) ? n : n.toFixed(2));
}

const CATEGORY_ORDER = [
  'Gathiya & Jalebi', 'Bhajiya', 'Hot Snack', 'Thepla',
  'Morning Bites', 'Chole / Kulcha / Puri Shak', 'Tea / Coffee / Bun', 'Extra'
];

async function loadMenu() {
  const listEl = document.getElementById('menuList');
  const { data, error } = await supabaseClient
    .from('ag_menu_items')
    .select('id, name, price, unit, gst_rate, category, is_paused, created_at')
    .eq('is_deleted', false)
    .order('created_at', { ascending: false });

  if (error) {
    listEl.innerHTML = '<div class="empty-state">Could not load menu: ' + escapeHtml(error.message) + '</div>';
    return;
  }

  if (!data || data.length === 0) {
    listEl.innerHTML = '<div class="empty-state">No menu items yet.</div>';
    return;
  }

  const groups = {};
  data.forEach((row) => {
    const cat = row.category || 'General';
    (groups[cat] = groups[cat] || []).push(row);
  });

  const orderedCats = [
    ...CATEGORY_ORDER.filter((c) => groups[c]),
    ...Object.keys(groups).filter((c) => !CATEGORY_ORDER.includes(c)).sort()
  ];

  listEl.innerHTML = orderedCats.map((cat) => `
    <h3 class="menu-category-header">${escapeHtml(cat)}</h3>
    ${groups[cat].map((row) => `
      <div class="staff-row" data-id="${row.id}">
        <div class="info">
          <h4>${escapeHtml(row.name)}</h4>
          <p><strong>${formatPrice(row.price)}</strong> <span style="color:var(--muted); margin-left:6px;">(${escapeHtml(row.unit)})</span></p>
          <p style="margin-top:4px;">
            GST:
            <input type="text" class="gst-rate-input" data-id="${row.id}" value="${row.gst_rate}" inputmode="decimal"
              style="width:50px; display:inline-block; padding:4px 6px; font-size:13px; border:1px solid var(--border); border-radius:6px;">%
          </p>
        </div>
        <div style="display:flex; flex-direction:column; align-items:center; gap:4px;">
          <label class="toggle-switch">
            <input type="checkbox" class="available-toggle" ${row.is_paused ? '' : 'checked'} data-id="${row.id}">
            <span class="toggle-slider"></span>
          </label>
          <span class="avail-status-label" style="font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:999px; ${row.is_paused ? 'background:#ffd400; color:#3a2e00;' : 'color:var(--muted);'}">${row.is_paused ? 'Paused' : 'Available'}</span>
        </div>
      </div>
    `).join('')}
  `).join('');

  document.querySelectorAll('.available-toggle').forEach((toggle) => {
    toggle.addEventListener('change', onToggleAvailable);
  });
  document.querySelectorAll('.gst-rate-input').forEach((input) => {
    input.addEventListener('change', onGstRateChange);
  });
}

async function onGstRateChange(e) {
  const input = e.target;
  const id = input.dataset.id;
  const rate = Number(input.value);

  if (isNaN(rate) || rate < 0) {
    alert('Please enter a valid GST rate.');
    loadMenu();
    return;
  }

  input.disabled = true;
  const { error } = await supabaseClient
    .from('ag_menu_items')
    .update({ gst_rate: rate })
    .eq('id', id);
  input.disabled = false;

  if (error) {
    alert('Could not update GST rate: ' + error.message);
    loadMenu();
  }
}

async function onToggleAvailable(e) {
  const checkbox = e.target;
  const id = checkbox.dataset.id;
  const isAvailable = checkbox.checked;
  const label = checkbox.closest('div').querySelector('.avail-status-label');

  checkbox.disabled = true;
  const { error } = await supabaseClient
    .from('ag_menu_items')
    .update({ is_paused: !isAvailable })
    .eq('id', id);
  checkbox.disabled = false;

  if (error) {
    checkbox.checked = !isAvailable;
    alert('Could not update item: ' + error.message);
    return;
  }
  if (label) {
    label.textContent = isAvailable ? 'Available' : 'Paused';
    label.style.background = isAvailable ? '' : '#ffd400';
    label.style.color = isAvailable ? 'var(--muted)' : '#3a2e00';
  }
}

document.getElementById('addItemForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const name = document.getElementById('itemName').value.trim();
  const priceRaw = document.getElementById('itemPrice').value.trim();
  const unit = document.getElementById('itemUnit').value.trim();
  const gstRateRaw = document.getElementById('itemGstRate').value.trim();
  const msgEl = document.getElementById('addItemMsg');
  const btn = document.getElementById('addItemBtn');

  const price = Number(priceRaw);
  const gstRate = Number(gstRateRaw);
  if (!name) {
    showMsg(msgEl, 'Please enter an item name.', 'error');
    return;
  }
  if (!priceRaw || isNaN(price) || price <= 0) {
    showMsg(msgEl, 'Please enter a valid price.', 'error');
    return;
  }
  if (!unit) {
    showMsg(msgEl, 'Please enter a unit (e.g. per pc, per 100g).', 'error');
    return;
  }
  if (gstRateRaw === '' || isNaN(gstRate) || gstRate < 0) {
    showMsg(msgEl, 'Please enter a valid GST rate.', 'error');
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Adding...';

  const { error } = await supabaseClient
    .from('ag_menu_items')
    .insert({
      name: name,
      price: price,
      unit: unit,
      gst_rate: gstRate,
      category: DEFAULT_CATEGORY,
      is_paused: false,
      is_deleted: false
    });

  btn.disabled = false;
  btn.textContent = 'Add Item';

  if (error) {
    showMsg(msgEl, error.message, 'error');
    return;
  }

  showMsg(msgEl, 'Item added.', 'success');
  document.getElementById('addItemForm').reset();
  loadMenu();
});

(async () => {
  const { data: sessionData } = await supabaseClient.auth.getSession();
  const user = sessionData.session ? sessionData.session.user : null;

  if (!user) {
    window.location.href = 'index.html';
    return;
  }

  const { data: profile, error } = await supabaseClient
    .from('ag_restaurant_profile')
    .select('approval_status')
    .eq('owner_user_id', user.id)
    .maybeSingle();

  if (error || !profile || profile.approval_status !== 'approved') {
    window.location.href = 'index.html';
    return;
  }

  document.getElementById('loadingRoot').style.display = 'none';
  document.getElementById('appRoot').style.display = 'flex';

  loadMenu();
})();
</script>
</body>
</html>
